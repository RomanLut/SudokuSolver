<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffaf2;
            --ink: #1f1a17;
            --muted: #6a5c52;
            --line: #dccdbf;
            --accent: #b75d2c;
            --accent-dark: #8d451e;
            --ok: #1e7a4f;
            --error: #a53a2f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, #fff6db 0, transparent 32%),
                linear-gradient(180deg, #efe4d4 0%, var(--bg) 100%);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 40px;
            line-height: 1;
        }

        p.lead {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 18px;
        }

        .layout {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 18px 50px rgba(67, 39, 18, 0.08);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            resize: vertical;
            font: 16px/1.45 Consolas, "Courier New", monospace;
            color: var(--ink);
            background: #fff;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            cursor: pointer;
            font: 600 14px/1 system-ui, sans-serif;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
        }

        button.primary:hover { background: var(--accent-dark); }

        button.secondary {
            background: #efe2d2;
            color: var(--ink);
        }

        .status {
            min-height: 24px;
            margin-top: 14px;
            font: 600 14px/1.4 system-ui, sans-serif;
        }

        .status.ok { color: var(--ok); }
        .status.error { color: var(--error); }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 0;
            width: min(100%, 420px);
            border: 3px solid var(--ink);
            background: #fff;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #999;
            border-bottom: 1px solid #999;
            font: 700 20px/1 Georgia, serif;
        }

        .cell.given {
            background: #f6ede0;
        }

        .cell:nth-child(3n) { border-right: 3px solid var(--ink); }
        .cell:nth-child(9n) { border-right: 0; }
        .cell:nth-child(n + 19):nth-child(-n + 27),
        .cell:nth-child(n + 46):nth-child(-n + 54) {
            border-bottom: 3px solid var(--ink);
        }

        h2 {
            margin: 0 0 14px;
            font-size: 22px;
        }

        .rules {
            margin: 0;
            padding-left: 20px;
            max-height: 420px;
            overflow: auto;
            font: 14px/1.45 Consolas, "Courier New", monospace;
        }

        pre {
            margin: 0;
            max-height: 420px;
            overflow: auto;
            padding: 14px;
            border-radius: 12px;
            background: #191512;
            color: #f7f1e8;
            font: 13px/1.45 Consolas, "Courier New", monospace;
        }

        .stack {
            display: grid;
            gap: 24px;
        }

        @media (max-width: 900px) {
            body { padding: 18px; }
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main>
    <h1>Sudoku Solver</h1>
    <p class="lead">Paste an 81-cell puzzle, solve it in the browser with a CLIPS WebAssembly runtime, and inspect the rules used.</p>

    <div class="layout">
        <section class="panel">
            <label for="puzzle">Puzzle Input</label>
            <textarea id="puzzle" spellcheck="false">...13.....1...45....2....6.1..3...7.2...5...8.4...6..9.5....7....67...9.....89...</textarea>
            <div class="actions">
                <button id="solve" class="primary">Solve Puzzle</button>
                <button id="sample" class="secondary" type="button">Load Sample</button>
                <button id="clear" class="secondary" type="button">Clear</button>
            </div>
            <div id="status" class="status"></div>
        </section>

        <section class="stack">
            <section class="panel">
                <h2>Solved Grid</h2>
                <div id="grid" class="grid" aria-live="polite"></div>
            </section>

            <section class="panel">
                <h2>Rules Used</h2>
                <ol id="rules" class="rules"></ol>
            </section>

            <section class="panel">
                <h2>Raw Solver Output</h2>
                <pre id="output"></pre>
            </section>
        </section>
    </div>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
