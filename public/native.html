<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver - Native CLIPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-styles.css">
</head>
<body>
<main class="container py-5">
    <div class="text-center mb-5">
        <h1>Sudoku Solver</h1>
        <p class="lead">Paste an 81-cell puzzle, solve it with the native CLIPS executable backend, and inspect the rules used.</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="panel">
                <div class="mb-3">
                    <h2 class="h4">Puzzle Input</h2>
                    <textarea id="puzzle" class="form-control" spellcheck="false">...13.....1...45....2....6.1..3...7.2...5...8.4...6..9.5....7....67...9.....89...</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button id="solve" class="btn btn-primary">Solve Puzzle</button>
                    <button id="sample" class="btn btn-secondary" type="button">Load Sample</button>
                    <button id="clear" class="btn btn-outline-secondary" type="button">Paste</button>
                </div>
                <div id="status" class="mt-3"></div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="row g-4">
                <div class="col-12">
                    <div class="panel">
                        <h2 class="h4">Grid</h2>
                        <div id="grid" class="grid" aria-live="polite"></div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="panel">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h2 class="h4 mb-0">Rules Used</h2>
                            <div class="d-flex gap-2">
                                <button id="step-first" class="btn btn-sm btn-outline-secondary" disabled>&#9646;&#9664; First</button>
                                <button id="step-prev" class="btn btn-sm btn-outline-secondary" disabled>&#9664; Prev</button>
                                <button id="step-next" class="btn btn-sm btn-outline-secondary" disabled>Next &#9654;</button>
                                <button id="step-last" class="btn btn-sm btn-outline-secondary" disabled>Last &#9654;&#9646;</button>
                            </div>
                        </div>
                        <ol id="rules" class="list-group list-group-numbered"></ol>
                    </div>
                </div>
                <div class="col-12">
                    <div class="panel">
                        <h2 class="h4">Raw Solver Output</h2>
                        <pre id="output"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module" src="./native-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
