name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Download CLIPS core source
        run: |
          mkdir -p vendor/clips631/clips_core_source_631
          svn checkout https://svn.code.sf.net/p/clipsrules/code/branches/63x/core vendor/clips631/clips_core_source_631/core
          ls -la vendor/clips631/clips_core_source_631/core/

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run prepare:web

      - name: Build WASM
        run: |
          cd vendor/clips631/clips_core_source_631/core
          mkdir -p ../../../public/wasm
          emcc *.c -O2 -s MODULARIZE=1 -s EXPORT_NAME=createClipsModule -s ENVIRONMENT=web,worker -s FORCE_FILESYSTEM=1 -s ALLOW_MEMORY_GROWTH=1 -s EXIT_RUNTIME=1 -s EMULATE_FUNCTION_POINTER_CASTS=1 -s EXPORTED_RUNTIME_METHODS="['callMain','FS']" -o ../../../public/wasm/clips.js
          echo "WASM build complete. Checking output files:"
          ls -la ../../../public/wasm/
          pwd

      - name: Verify WASM files exist
        run: |
          if [ -f "public/wasm/clips.js" ] && [ -f "public/wasm/clips.wasm" ]; then
            echo "✓ WASM files found:"
            ls -la public/wasm/
          else
            echo "✗ WASM files missing!"
            echo "Contents of public/wasm/:"
            ls -la public/wasm/ || echo "Directory does not exist"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
